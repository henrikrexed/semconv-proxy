# Default values for semconv-proxy-chart.
# Chart artifact name (semconv-proxy-chart) intentionally differs from the container
# image name (semconv-proxy) so the OCI Helm chart and the container image do not
# collide under ghcr.io/henrikrexed/.

replicaCount: 1

image:
  # Container image published from this repo. See .github/workflows/ci.yaml.
  repository: ghcr.io/henrikrexed/semconv-proxy
  pullPolicy: IfNotPresent
  # If empty, the chart uses .Chart.AppVersion. Pin to "main" for the rolling main image
  # or to a specific "main-<sha7>" / "vX.Y.Z" tag for an immutable reference.
  tag: ""

# Optional secrets used to pull the image from a private registry.
imagePullSecrets: []

# Override the chart-derived "name" / "fullname" if needed.
nameOverride: ""
fullnameOverride: ""

# Extra annotations applied to the pod template (useful for sidecar injectors,
# observability scrapers, etc.).
podAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  ports:
    http: 4318
    grpc: 4317
    api: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  # REQUIRED. Where the proxy forwards OTLP traffic after observing it.
  # Example: otel-collector.observability.svc.cluster.local:4317
  backendEndpoint: ""
  backendInsecure: true
  logLevel: info
  dataDir: /data
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  apiPort: 8080
  shardCount: 64
  globalBudget: 10000
  perAttrCap: 1000
  ringBufferSize: 10000
  workerCount: 0
  ttlStale: 24h
  ttlPurge: 168h

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClassName: ""

# Legacy Ingress exposing the Web UI + REST API on the api port (8080).
# The SemConv Explorer UI is served at "/" on the api port, so this routes the
# ingress host root straight to it. OTLP ingest (4317/4318) is intentionally NOT
# exposed here. Disabled by default; prefer the Gateway API below when available.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: semconv.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: semconv-proxy-tls
  #     hosts:
  #       - semconv.example.com

# Gateway API ingress (preferred over legacy Ingress).
# Requires the Gateway API CRDs and an installed Gateway controller in the cluster.
# This block makes the chart create and manage its OWN Gateway. For clusters that
# already run a shared Gateway, leave this disabled and use the httpRoute block below.
gateway:
  enabled: false
  className: ""
  annotations: {}
  hostnames: []
  listeners:
    - name: http
      port: 80
      protocol: HTTP

# Gateway API HTTPRoute exposing the Web UI + REST API (both served on the api
# port, 8080) through a Gateway. Two mutually-supportive modes:
#   1. Existing/shared Gateway (recommended): set httpRoute.enabled=true and point
#      httpRoute.parentRefs at a pre-existing Gateway. The chart does NOT create a
#      Gateway in this mode.
#   2. Self-managed Gateway: set gateway.enabled=true (above). The HTTPRoute then
#      attaches to the chart's own Gateway automatically; httpRoute.parentRefs may
#      stay empty.
# OTLP ingest (4317/4318) is intentionally NOT routed here.
httpRoute:
  enabled: false
  # Attach to a pre-existing Gateway. Each entry: name (required), plus optional
  # namespace, sectionName (the Gateway listener name), and port.
  parentRefs: []
    # - name: shared-gateway
    #   namespace: gateway-system
    #   sectionName: https
  # Hostnames the route answers for. Empty = match all hostnames on the listener.
  # Falls back to gateway.hostnames when empty and gateway.enabled.
  hostnames: []
  # Path prefix to match. "/" serves both the Explorer UI and /api/v1/*.
  pathPrefix: /
  # Service port to route to. Defaults to the api port (service.ports.api, 8080),
  # which serves the Web UI + REST API. Do NOT point this at the OTLP ports.
  backendPort: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
