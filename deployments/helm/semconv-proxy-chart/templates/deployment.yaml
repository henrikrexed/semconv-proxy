apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semconv-proxy-chart.fullname" . }}
  labels:
    {{- include "semconv-proxy-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "semconv-proxy-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "semconv-proxy-chart.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "semconv-proxy-chart.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: semconv-proxy
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "semconv-proxy-chart.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/config/config.yaml
            - --backend-endpoint={{ required "config.backendEndpoint is required (the OTLP backend the proxy forwards to)" .Values.config.backendEndpoint }}
            - --log-level={{ .Values.config.logLevel }}
          ports:
            - name: http
              containerPort: {{ .Values.config.otlpHttpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.config.otlpGrpcPort }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.config.apiPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: {{ .Values.config.dataDir }}
      volumes:
        - name: config
          configMap:
            name: {{ include "semconv-proxy-chart.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "semconv-proxy-chart.fullname" . }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
