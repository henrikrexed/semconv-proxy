{{- if or .Values.httpRoute.enabled .Values.gateway.enabled }}
{{- $hostnames := .Values.httpRoute.hostnames | default .Values.gateway.hostnames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "semconv-proxy-chart.fullname" . }}
  labels:
    {{- include "semconv-proxy-chart.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.httpRoute.parentRefs }}
    {{- range .Values.httpRoute.parentRefs }}
    - name: {{ .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
    {{- else if .Values.gateway.enabled }}
    {{- range .Values.gateway.listeners }}
    - name: {{ include "semconv-proxy-chart.fullname" $ }}
      sectionName: {{ .name }}
    {{- end }}
    {{- end }}
  {{- with $hostnames }}
  hostnames:
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.pathPrefix | default "/" | quote }}
      backendRefs:
        - name: {{ include "semconv-proxy-chart.fullname" . }}
          port: {{ .Values.httpRoute.backendPort | default .Values.service.ports.api }}
{{- end }}
