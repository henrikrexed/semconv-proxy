apiVersion: v1
kind: Service
metadata:
  name: {{ include "semconv-proxy-chart.fullname" . }}
  labels:
    {{- include "semconv-proxy-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.ports.grpc }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.service.ports.api }}
      targetPort: api
      protocol: TCP
      name: api
  selector:
    {{- include "semconv-proxy-chart.selectorLabels" . | nindent 4 }}
