replicaCount: 1

image:
  repository: ghcr.io/henrikrexed/semconv-proxy
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  ports:
    http: 4318
    grpc: 4317
    api: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

config:
  backendEndpoint: ""
  backendInsecure: true
  logLevel: info
  dataDir: /data
  otlpHttpPort: 4318
  otlpGrpcPort: 4317
  apiPort: 8080
  shardCount: 64
  globalBudget: 10000
  perAttrCap: 1000
  ringBufferSize: 10000
  workerCount: 0
  ttlStale: 24h
  ttlPurge: 168h

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
