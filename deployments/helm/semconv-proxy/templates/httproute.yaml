{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "semconv-proxy.fullname" . }}
  labels:
    {{- include "semconv-proxy.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "semconv-proxy.fullname" . }}
      {{- range .Values.gateway.listeners }}
      sectionName: {{ .name }}
      {{- end }}
  {{- if .Values.gateway.hostnames }}
  hostnames:
    {{- range .Values.gateway.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "semconv-proxy.fullname" . }}
          port: {{ .Values.service.ports.http }}
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
