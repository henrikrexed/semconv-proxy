apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semconv-proxy.fullname" . }}
  labels:
    {{- include "semconv-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "semconv-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "semconv-proxy.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "semconv-proxy.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/config/config.yaml
            - --backend-endpoint={{ .Values.config.backendEndpoint }}
            - --log-level={{ .Values.config.logLevel }}
          ports:
            - name: http
              containerPort: {{ .Values.config.otlpHttpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.config.otlpGrpcPort }}
              protocol: TCP
            - name: api
              containerPort: {{ .Values.config.apiPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "semconv-proxy.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "semconv-proxy.fullname" . }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
