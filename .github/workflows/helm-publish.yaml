name: Helm Publish

# Lints, packages, and publishes the SemConv Proxy Helm chart to GHCR as an OCI artifact.
#
# Triggers
#   - push to main when the chart or this workflow changes
#       -> publishes chart version "<Chart.yaml-version>-main.<sha7>"
#          to oci://ghcr.io/henrikrexed/semconv-proxy-chart
#   - tags of shape "v*" (release)
#       -> publishes chart version equal to the tag (without the leading "v")
#   - manual dispatch with an optional version override
#
# The chart artifact name is intentionally distinct from the container image
# (semconv-proxy) so the OCI chart at ghcr.io/henrikrexed/semconv-proxy-chart
# does not collide with the container image at ghcr.io/henrikrexed/semconv-proxy.

on:
  push:
    branches:
      - main
    paths:
      - 'deployments/helm/semconv-proxy-chart/**'
      - '.github/workflows/helm-publish.yaml'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths:
      - 'deployments/helm/semconv-proxy-chart/**'
      - '.github/workflows/helm-publish.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override chart version (semver). Leave blank to derive from Chart.yaml + git ref.'
        required: false
        type: string

concurrency:
  group: helm-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: deployments/helm/semconv-proxy-chart
  CHART_NAME: semconv-proxy-chart
  OCI_REGISTRY: ghcr.io
  # Chart pushes to oci://ghcr.io/henrikrexed -> end up at
  # ghcr.io/henrikrexed/semconv-proxy-chart (separate package from the container image).
  OCI_NAMESPACE: ghcr.io/${{ github.repository_owner }}

jobs:
  lint:
    name: Lint chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        run: |
          helm lint "${CHART_DIR}" \
            --set config.backendEndpoint=otel-collector.observability.svc.cluster.local:4317

      - name: helm template (smoke render)
        run: |
          helm template smoke "${CHART_DIR}" \
            --namespace observability \
            --set config.backendEndpoint=otel-collector.observability.svc.cluster.local:4317 \
            --set gateway.enabled=true \
            --set gateway.className=istio \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) Kubernetes objects."

  publish:
    name: Package & publish
    needs: lint
    # Only publish on main, on v* tag, or manual dispatch — never on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      chart_ref: ${{ steps.version.outputs.chart_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Compute chart version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base_version=$(awk '/^version:/ {print $2; exit}' "${CHART_DIR}/Chart.yaml")
          case "${GITHUB_REF}" in
            refs/tags/v*)
              chart_version="${GITHUB_REF_NAME#v}"
              ;;
            *)
              if [ -n "${DISPATCH_VERSION:-}" ]; then
                chart_version="${DISPATCH_VERSION}"
              else
                chart_version="${base_version}-main.${GITHUB_SHA::7}"
              fi
              ;;
          esac
          echo "Base Chart.yaml version: ${base_version}"
          echo "Resolved chart version : ${chart_version}"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "chart_ref=oci://${OCI_NAMESPACE}/${CHART_NAME}:${chart_version}" >> "$GITHUB_OUTPUT"

      - name: Stamp Chart.yaml version
        run: |
          set -euo pipefail
          sed -i -E "s|^version:.*$|version: ${{ steps.version.outputs.chart_version }}|" "${CHART_DIR}/Chart.yaml"
          echo "--- Chart.yaml ---"
          cat "${CHART_DIR}/Chart.yaml"

      - name: helm package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "${CHART_DIR}" --destination dist
          ls -la dist/

      - name: helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "${OCI_REGISTRY}" \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: helm push
        run: |
          set -euo pipefail
          pkg="dist/${CHART_NAME}-${{ steps.version.outputs.chart_version }}.tgz"
          test -f "${pkg}" || { echo "Package not found: ${pkg}"; ls dist/; exit 1; }
          helm push "${pkg}" "oci://${OCI_NAMESPACE}"

      - name: Upload chart package artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-${{ steps.version.outputs.chart_version }}
          path: dist/*.tgz
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## Helm chart published"
            echo ""
            echo "| Field | Value |"
            echo "|------|------|"
            echo "| Chart | \`${CHART_NAME}\` |"
            echo "| Version | \`${{ steps.version.outputs.chart_version }}\` |"
            echo "| Reference | \`${{ steps.version.outputs.chart_ref }}\` |"
            echo "| Container image | \`ghcr.io/${{ github.repository }}\` (separate package) |"
            echo ""
            echo "### Pull"
            echo ""
            echo "\`\`\`bash"
            echo "helm pull ${{ steps.version.outputs.chart_ref }}"
            echo "\`\`\`"
            echo ""
            echo "### Install"
            echo ""
            echo "\`\`\`bash"
            echo "helm install semconv-proxy ${{ steps.version.outputs.chart_ref }} \\"
            echo "  --set config.backendEndpoint=<host>:<port>"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
